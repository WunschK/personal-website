# Site settings
title: Kevin Wunsch | hello world
description: Thoughts on digital humanities, programming, and technology
author: Kevin Wunsch
email: your-email@example.com
baseurl: "/personal-website" # Repository name for GitHub Pages
url: "https://wunschk.github.io" # Your site URL when deployed

# Build settings
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Exclude from processing
exclude:
  - .vscode/
  - coverage/
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Kevin Wunsch"
